[workspace]
name = "orchid-cagra"
channels = ["rapidsai", "conda-forge", "nvidia"]
channel-priority = "disabled"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build-cagra = "python ../build_cagra.py"
check-cagra-source = "python ../build_cagra.py --check-source"
perf-cagra = "python ../perf_cagra.py"
smoke-cagra = "python ../cagra_native/smoke_test.py"
smoke-harness = "python ../../scripts/smoke_harness.py --methods cagra"
benchmark = "python ../../scripts/benchmark.py"

[dependencies]
python = ">=3.12,<3.13"
numpy = ">=2,<2.2"
pydantic = ">=2.12.5,<3"
pyyaml = ">=6.0.3,<7"
cmake = ">=3.30,<4"
pybind11 = ">=2.11,<4"
gcc_linux-64 = "13.*"
gxx_linux-64 = "13.*"
mkl = ">=2024.2.2,<2025"
mkl-include = ">=2025.3.0,<2026"
libcuvs = "25.08.*"
cuda-version = "12.8.*"
cuda-nvcc = "12.8.*"
ninja = ">=1.12,<2"
pip = ">=25,<26"

[pypi-dependencies]
utils_cpp = { path = "../utils_cpp", editable = true }
zarr = ">=3.1.5,<4"
zarrs = ">=0.2.1,<0.3"
