kind: baseline_perf
args:
  baseline: cagra
  batch_size: 1
  warmup: 1
  iterations: 100
  min_iterations: 3
  qps_relative_ci_half_width: 0.05
  cache_base: cached
  index_base: cached/baselines
  log_base: logs
  exp_name: CAGRA
  normalize: true
  # Match CAGRA_SIGMOD_Artifacts: native cuVS build and per-query filtering.
  graph_degree: 32
  intermediate_graph_degree: 64
  device: 0
  per_dataset:
    laion_all:
      index_name: laion
      metric: ip
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    laion_neg:
      index_name: laion
      metric: ip
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    laion_pos:
      index_name: laion
      metric: ip
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    sift12:
      index_name: sift
      metric: l2
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
    sift24:
      index_name: sift
      metric: l2
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
    sift48:
      index_name: sift
      metric: l2
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
    sift_r10:
      index_name: sift
      metric: l2
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
    sift_r20:
      index_name: sift
      metric: l2
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
    sift_r40:
      index_name: sift
      metric: l2
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
    yfcc:
      index_name: yfcc
      metric: l2
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288]
    yfcc_single:
      index_name: yfcc
      metric: l2
      itopk_size: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288]
