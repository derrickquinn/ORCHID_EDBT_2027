kind: baseline_perf
args:
  baseline: navix
  batch_size: 100
  warmup: 1
  iterations: 100
  min_iterations: 3
  qps_relative_ci_half_width: 0.05
  cache_base: cached
  index_base: cached/baselines
  log_base: logs
  exp_name: NaviX
  normalize: true
  m: 32
  ef_construction: 200
  per_dataset:
    laion_all:
      index_name: laion
      metric: ip
      ef_search: [2, 4, 8, 16, 32, 64, 96, 128, 256, 512, 1024, 2048, 4096, 8192]
    laion_neg:
      index_name: laion
      metric: ip
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
    laion_pos:
      index_name: laion
      metric: ip
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
    sift12:
      index_name: sift
      metric: l2
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    sift24:
      index_name: sift
      metric: l2
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    sift48:
      index_name: sift
      metric: l2
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    sift_r10:
      index_name: sift
      metric: l2
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    sift_r20:
      index_name: sift
      metric: l2
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    sift_r40:
      index_name: sift
      metric: l2
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    yfcc:
      index_name: yfcc
      metric: l2
      ef_search: [8, 16, 32, 64, 128, 256, 512, 1024]
    yfcc_single:
      index_name: yfcc
      metric: l2
      ef_search: [8, 16, 32, 64, 128, 256, 512, 1024]
