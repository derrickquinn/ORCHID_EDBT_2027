kind: baseline_perf
args:
  baseline: acorn
  batch_size: 100
  warmup: 1
  iterations: 100
  min_iterations: 3
  qps_relative_ci_half_width: 0.05
  cache_base: cached
  index_base: cached/baselines
  log_base: logs
  exp_name: ACORN
  normalize: true
  m: 32
  per_dataset:
    laion_all:
      index_name: laion
      metric: ip
      gamma: 30
      m_beta: 32
      metadata_mode: dummy
      ef_search: [2, 4, 8, 16, 32, 64, 96, 128, 256, 512, 1024, 2048, 4096, 8192]
    laion_neg:
      index_name: laion
      metric: ip
      gamma: 30
      m_beta: 32
      metadata_mode: dummy
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
    laion_pos:
      index_name: laion
      metric: ip
      gamma: 30
      m_beta: 32
      metadata_mode: dummy
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
    sift12:
      index_name: sift12
      metric: l2
      gamma: 12
      m_beta: 64
      metadata_mode: workload_scalar
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    sift24:
      index_name: sift24
      metric: l2
      gamma: 24
      m_beta: 64
      metadata_mode: workload_scalar
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
    sift48:
      index_name: sift48
      metric: l2
      gamma: 48
      m_beta: 64
      metadata_mode: workload_scalar
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
    sift_r10:
      index_name: sift_r10
      metric: l2
      gamma: 100
      m_beta: 64
      metadata_mode: dummy
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
    sift_r20:
      index_name: sift_r20
      metric: l2
      gamma: 50
      m_beta: 64
      metadata_mode: dummy
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
    sift_r40:
      index_name: sift_range
      metric: l2
      gamma: 1000
      m_beta: 64
      metadata_mode: dummy
      ef_search: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    yfcc:
      metric: l2
      gamma: 53
      m_beta: 64
      metadata_mode: dummy
      ef_search: [8, 16, 32, 64, 128, 256, 512, 1024]
    yfcc_single:
      metric: l2
      gamma: 33
      m_beta: 32
      metadata_mode: dummy
      ef_search: [8, 16, 32, 64, 128, 256, 512, 1024]
