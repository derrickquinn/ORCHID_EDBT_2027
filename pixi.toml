[workspace]
name = "orchid-edbt"
version = "0.2.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
build-faiss = "python scripts/build_faiss.py"
build-baselines = "python orchid/baseline_adapters/build_adapters.py"
check-baseline-sources = "python orchid/baseline_adapters/build_adapters.py --check-sources --no-fetch"
smoke-baselines = "python scripts/smoke_baselines.py"
smoke-harness = "python scripts/smoke_harness.py"
check = "python scripts/check.py"
benchmark = "python scripts/benchmark.py"
calibrate = { cmd = "python test_orchid.py", cwd = "orchid" }
optimize = { cmd = "python optimize_orchid.py", cwd = "orchid" }

[dependencies]
python = "3.12.*"
numpy = "2.3.*"
pip = ">=25,<26"
setuptools = ">=68,<81"
wheel = ">=0.45,<1"
cmake = ">=3.30,<4"
ninja = ">=1.12,<2"
swig = ">=4.2,<5"
gcc_linux-64 = "13.*"
gxx_linux-64 = "13.*"
git = ">=2.40,<3"
pybind11 = ">=2.11,<4"
mkl = ">=2024.2.2,<2025"
mkl-include = ">=2025.3.0,<2026"
libblas = { version = "*", build = "*mkl" }
liblapack = { version = "*", build = "*mkl" }
zlib = ">=1.2,<2"
pydantic = ">=2.12.5,<3"
pyyaml = ">=6.0.3,<7"
numba = ">=0.63.1,<0.64"
tqdm = ">=4.67.1,<5"

[pypi-dependencies]
torch = ">=2.9.1,<3"
zarr = ">=3.1.5,<4"
zarrs = ">=0.2.1,<0.3"
utils_cpp = { path = "orchid/utils_cpp", editable = true }
